name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test tools and verify APK builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk-headless zipalign apksigner smali dalvik-exchange libandroid-23-java

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Cache base APK
        uses: actions/cache@v4
        with:
          path: .cache/tomotoru_v1.0.4.apk
          key: tomotoru-base-v0.0.1-e457b427

      - name: Prepare test fixtures
        run: |
          mkdir -p tests/.cache
          jar_path=org/json/json/20231013/json-20231013.jar
          curl -fsSL --retry 2 --retry-max-time 15 --max-time 15 \
            "https://repo.maven.apache.org/maven2/$jar_path" -o tests/.cache/org-json.jar ||
          curl -fsSL --retry 2 --retry-max-time 15 --max-time 15 \
            "https://maven-central.storage-download.googleapis.com/maven2/$jar_path" -o tests/.cache/org-json.jar
          echo "0f18192df289114e17aa1a0d0a7f8372cc9f5c7e4f7e39adcf8906fe714fa7d3  tests/.cache/org-json.jar" | sha256sum --check
          tomotoru-fetch-base --extract-sxr
          python -m tools.assets.sxr_extract
          python -m tools.squirrel.decompile
          python -m tools.squirrel.export_conf

      - name: Verify all APK build modes
        run: |
          tomotoru-build --mode original
          cmp .cache/tomotoru_v1.0.4.apk dist/tomotoru-v1.0.4-original.apk
          tomotoru-build --mode offline
          tomotoru-build --mode offline-test
          tomotoru-build --mode online --url https://example.com
          tomotoru-build --mode online-test

      - name: Run pytest
        run: python -m pytest -v

  notify-builds:
    name: Notify Tomotoru Builds
    needs: verify
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Dispatch upstream-changed event
        env:
          GH_TOKEN: ${{ secrets.BUILDS_DISPATCH_TOKEN }}
          BUILDS_REPOSITORY: ${{ vars.BUILDS_REPOSITORY || 'bringbacktomotoru/builds' }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::BUILDS_DISPATCH_TOKEN is not configured; skipping Builds notification."
            exit 0
          fi
          gh api --method POST "repos/$BUILDS_REPOSITORY/dispatches" \
            -f event_type=upstream-changed \
            -f "client_payload[repo]=$GITHUB_REPOSITORY" \
            -f "client_payload[sha]=$GITHUB_SHA"
